[workspace]
resolver = "2"
members = [
    "packages/hw-ir",
    "packages/hw-merge",
    "packages/mcp-gateway",
    "packages/wasm-sandbox",
    "packages/hw-dlp",
    "packages/cad-geom",
    "packages/placement-router",
    "packages/cad-transcoder",
    "packages/component-kg",
    "packages/open-cubo",
    "packages/symbolic-verifier",
    "packages/nine-gates",
    "packages/eco-engine",
    "packages/sim-compat",
    "packages/cam-pnp",
    "packages/cli",
    "packages/pdn-solver",
    "packages/pcb-diff",
    "packages/wire-harness",
    "packages/panelizer",
    "packages/worker-sdk",
    "packages/emc-workbench",
    "packages/cas-store",
    "packages/schematic-beautifier",
    "packages/autorouter",
    "packages/footprint-synth",
    "packages/solver-recovery",
    "packages/control-loop",
    "packages/compliance-hbom",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rusqlite = { version = "0.34", features = ["bundled", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.16", features = ["v7", "serde"] }
sha2 = "0.10"
rayon = "1.10"
rand = "0.8"
rand_chacha = "0.3"
wasmtime = { version = "50.0.0", features = ["component-model"] }
wasmtime-wasi = "50.0.0"
notify = "8.0"
opentelemetry = "0.28"
tokio = { version = "1.44", features = ["full"] }
ed25519-dalek = "2.1"
thiserror = "2.0"
rstar = "0.12"
i_overlay = "1.5"
cavalier_contours = "0.4"
