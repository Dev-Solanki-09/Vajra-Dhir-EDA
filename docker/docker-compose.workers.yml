# ==============================================================================
# Vajra-Dhīr EDA — Ring 2 Production OCI Workers (Zero-Egress gVisor)
# Standards: ISO/IEC/IEEE 42010, CIS Docker Benchmark, gVisor runsc Sandbox
# ==============================================================================
services:
  pack-2a-pcb-physics:
    build:
      context: ../containers/pack-2a-kicad
      dockerfile: Dockerfile
    image: vajradhir/pack-2a-pcb-physics:latest
    container_name: vd_pack_2a_pcb_physics
    runtime: runsc
    network_mode: "none"
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    volumes:
      - vd_cas_work:/vd_work:rw
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M

  pack-2b-virtual-hil:
    build:
      context: ../containers/pack-2b-virtual-lab
      dockerfile: Dockerfile
    image: vajradhir/pack-2b-virtual-hil:latest
    container_name: vd_pack_2b_virtual_hil
    runtime: runsc
    network_mode: "none"
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    volumes:
      - vd_cas_work:/vd_work:rw
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M

  pack-2c-silicon-ic:
    build:
      context: ../containers/pack-2c-silicon-asic
      dockerfile: Dockerfile
    image: vajradhir/pack-2c-silicon-ic:latest
    container_name: vd_pack_2c_silicon_ic
    runtime: runsc
    network_mode: "none"
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    volumes:
      - vd_cas_work:/vd_work:rw
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M

volumes:
  vd_cas_work:
    name: vajradhir_cas_cache
