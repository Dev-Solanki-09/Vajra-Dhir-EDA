[package]
name = "vd-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vajra-Dhīr EDA Unified Developer CLI (`vd`)"

[[bin]]
name = "vd"
path = "src/main.rs"

[dependencies]
vd-ir = { path = "../hw-ir" }
vd-eco-engine = { path = "../eco-engine" }
vd-sim-compat = { path = "../sim-compat" }
vd-cam-pnp = { path = "../cam-pnp" }
vd-nine-gates = { path = "../nine-gates" }
vd-symbolic-verifier = { path = "../symbolic-verifier" }
vd-hw-dlp = { path = "../hw-dlp" }
vd-pdn-solver = { path = "../pdn-solver" }
vd-pcb-diff = { path = "../pcb-diff" }
vd-wire-harness = { path = "../wire-harness" }
vd-panelizer = { path = "../panelizer" }
vd-worker-sdk = { path = "../worker-sdk" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3.17"
