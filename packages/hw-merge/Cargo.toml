[package]
name = "vd-merge"
version = "0.0.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Deterministic Semantic 3-Way Hardware Merge Driver for Vajra-Dhīr EDA"

[[bin]]
name = "hw-merge"
path = "src/main.rs"

[dependencies]
vd-ir = { path = "../hw-ir" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3.17"
