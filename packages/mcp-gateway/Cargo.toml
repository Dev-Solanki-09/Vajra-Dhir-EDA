[package]
name = "vd-mcp-gateway"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Frontier Harness MCP v2 Gateway (12 Verbs) for Vajra-Dhīr EDA"

[[bin]]
name = "vd-mcp"
path = "src/main.rs"

[dependencies]
vd-ir = { path = "../hw-ir" }
vd-merge = { path = "../hw-merge" }
vd-wasm-sandbox = { path = "../wasm-sandbox" }
vd-dlp = { path = "../hw-dlp" }
vd-cad-geom = { path = "../cad-geom" }
vd-placer = { path = "../placement-router" }
vd-transcoder = { path = "../cad-transcoder" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3.17"
