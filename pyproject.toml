[project]
name = "vajra-dhir-eda-py"
version = "0.0.1"
description = "Vajra-Dhīr EDA — Python Neuro-Symbolic Brain Workspace"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "z3-solver>=4.14.0",
    "sympy>=1.13.3",
    "pint>=0.24.4",
    "control>=0.10.1",
    "pypdfium2>=4.30.0",
    "pdfplumber>=0.11.0",
    "duckdb>=1.2.0",
    "pydantic>=2.10.0",
    "atopile>=0.3.0",
    "kikit>=1.6.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.9.0", "mypy>=1.15.0"]
pcb-lib = ["kicad-python>=0.4.0"]

[tool.uv.workspace]
members = [
    "packages/symbolic-verifier",
    "packages/kg-brain",
    "packages/cubo-engine",
    "packages/ambient-knowledge",
]
